<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujan's Spending Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .budget-display {
            text-align: center;
        }

        .budget-display .label {
            color: #666;
            font-size: 14px;
        }

        .budget-display .amount {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }

        .stats {
            display: flex;
            gap: 10px;
        }

        .stat-box {
            flex: 1;
            text-align: center;
            padding: 15px;
            border-radius: 15px;
        }

        .stat-box.spent {
            background: #ffe5e5;
        }

        .stat-box.remaining {
            background: #e5ffe5;
        }

        .stat-box .stat-label {
            font-size: 12px;
            color: #666;
        }

        .stat-box .stat-amount {
            font-size: 20px;
            font-weight: bold;
        }

        .spent .stat-amount {
            color: #e74c3c;
        }

        .remaining .stat-amount {
            color: #27ae60;
        }

        .progress-section {
            margin-top: 10px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #666;
        }

        .progress-bar {
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: all 0.5s ease;
        }

        .status-card {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            border-radius: 20px;
            padding: 20px;
        }

        .status-card.green {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
        }

        .status-card.yellow {
            background: linear-gradient(135deg, #f39c12, #f1c40f);
        }

        .status-card.red {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .status-emoji {
            font-size: 40px;
        }

        .status-text {
            font-size: 16px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .expenses-title {
            color: white;
            margin: 20px 0 10px 0;
            font-size: 18px;
        }

        .expense-item {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .expense-info h3 {
            font-size: 16px;
            color: #333;
        }

        .expense-info p {
            font-size: 12px;
            color: #999;
        }

        .expense-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .expense-amount {
            font-size: 18px;
            font-weight: bold;
            color: #e74c3c;
        }

        .delete-btn {
            background: #ffe5e5;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .no-expenses {
            text-align: center;
            color: rgba(255,255,255,0.7);
            padding: 30px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Sujan's Spending Tracker</h1>

        <!-- Budget Display -->
        <div class="card budget-display">
            <p class="label">This Month's Pocket Money</p>
            <p class="amount" id="budgetAmount">₹0</p>
            <button class="btn btn-primary" onclick="setBudget()">Set Pocket Money</button>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="card stat-box spent">
                <p class="stat-label">💸 Spent</p>
                <p class="stat-amount" id="spentAmount">₹0</p>
            </div>
            <div class="card stat-box remaining">
                <p class="stat-label">💵 Remaining</p>
                <p class="stat-amount" id="remainingAmount">₹0</p>
            </div>
        </div>

        <!-- Progress -->
        <div class="card">
            <div class="progress-section">
                <div class="progress-header">
                    <span>Budget Remaining</span>
                    <span id="percentage">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%; background: #27ae60;"></div>
                </div>
            </div>
        </div>

        <!-- Status -->
        <div class="status-card green" id="statusCard">
            <span class="status-emoji" id="statusEmoji">😊</span>
            <span class="status-text" id="statusText">Set your pocket money to start!</span>
        </div>

        <!-- Add Expense -->
        <div class="card" style="margin-top: 15px;">
            <div class="input-group">
                <label>What did you spend on?</label>
                <input type="text" id="expenseDesc" placeholder="e.g., Food, Transport, Shopping">
            </div>
            <div class="input-group">
                <label>Amount (₹)</label>
                <input type="number" id="expenseAmount" placeholder="Enter amount">
            </div>
            <button class="btn btn-primary" onclick="addExpense()">➕ Add Expense</button>
        </div>

        <!-- Expenses List -->
        <h2 class="expenses-title">📝 Recent Expenses</h2>
        <div id="expensesList">
            <p class="no-expenses">No expenses yet!</p>
        </div>

        <!-- Reset Button -->
        <button class="btn btn-danger" onclick="resetAll()" style="margin-top: 20px;">🔄 Reset Everything</button>
    </div>

    <script>
        // Load data from localStorage
        let budget = parseFloat(localStorage.getItem('sujan_budget')) || 0;
        let expenses = JSON.parse(localStorage.getItem('sujan_expenses')) || [];

        // Initialize
        updateUI();

        function setBudget() {
            const amount = prompt('Enter your pocket money for this month:');
            if (amount && !isNaN(amount) && parseFloat(amount) > 0) {
                budget = parseFloat(amount);
                localStorage.setItem('sujan_budget', budget);
                updateUI();
            }
        }

        function addExpense() {
            const desc = document.getElementById('expenseDesc').value.trim();
            const amount = parseFloat(document.getElementById('expenseAmount').value);

            if (!desc) {
                alert('Please enter what you spent on!');
                return;
            }
            if (!amount || amount <= 0) {
                alert('Please enter a valid amount!');
                return;
            }
            if (budget <= 0) {
                alert('Please set your pocket money first!');
                return;
            }

            const expense = {
                id: Date.now(),
                desc: desc,
                amount: amount,
                date: new Date().toLocaleDateString('en-IN', { 
                    day: 'numeric', 
                    month: 'short',
                    hour: '2-digit',
                    minute: '2-digit'
                })
            };

            expenses.unshift(expense);
            localStorage.setItem('sujan_expenses', JSON.stringify(expenses));

            document.getElementById('expenseDesc').value = '';
            document.getElementById('expenseAmount').value = '';

            updateUI();
        }

        function deleteExpense(id) {
            if (confirm('Delete this expense?')) {
                expenses = expenses.filter(e => e.id !== id);
                localStorage.setItem('sujan_expenses', JSON.stringify(expenses));
                updateUI();
            }
        }

        function resetAll() {
            if (confirm('This will delete all your data. Are you sure?')) {
                budget = 0;
                expenses = [];
                localStorage.removeItem('sujan_budget');
                localStorage.removeItem('sujan_expenses');
                updateUI();
            }
        }

        function updateUI() {
            const totalSpent = expenses.reduce((sum, e) => sum + e.amount, 0);
            const remaining = budget - totalSpent;
            const percentage = budget > 0 ? (remaining / budget) * 100 : 0;

            // Update amounts
            document.getElementById('budgetAmount').textContent = '₹' + budget.toFixed(0);
            document.getElementById('spentAmount').textContent = '₹' + totalSpent.toFixed(0);
            document.getElementById('remainingAmount').textContent = '₹' + remaining.toFixed(0);
            document.getElementById('percentage').textContent = percentage.toFixed(0) + '%';

            // Update progress bar
            const progressFill = document.getElementById('progressFill');
            progressFill.style.width = Math.max(0, Math.min(100, percentage)) + '%';

            // Update status
            const statusCard = document.getElementById('statusCard');
            const statusEmoji = document.getElementById('statusEmoji');
            const statusText = document.getElementById('statusText');

            if (percentage > 50) {
                statusCard.className = 'status-card green';
                statusEmoji.textContent = '😊';
                statusText.textContent = 'Great! You\'re saving well!';
                progressFill.style.background = '#27ae60';
            } else if (percentage > 25) {
                statusCard.className = 'status-card yellow';
                statusEmoji.textContent = '😐';
                statusText.textContent = 'Careful! Spending increasing...';
                progressFill.style.background = '#f39c12';
            } else {
                statusCard.className = 'status-card red';
                statusEmoji.textContent = '😰';
                statusText.textContent = 'Warning! Low balance!';
                progressFill.style.background = '#e74c3c';
            }

            // Update expenses list
            const expensesList = document.getElementById('expensesList');
            if (expenses.length === 0) {
                expensesList.innerHTML = '<p class="no-expenses">No expenses yet!</p>';
            } else {
                expensesList.innerHTML = expenses.map(e => `
                    <div class="expense-item">
                        <div class="expense-info">
                            <h3>${e.desc}</h3>
                            <p>${e.date}</p>
                        </div>
                        <div class="expense-right">
                            <span class="expense-amount">-₹${e.amount}</span>
                            <button class="delete-btn" onclick="deleteExpense(${e.id})">🗑️</button>
                        </div>
                    </div>
                `).join('');
            }
        }
    </script>
</body>
</html>
